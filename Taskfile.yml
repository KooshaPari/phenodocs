version: "3"

vars:
  GO_MODULES:
    sh: find . \( -path './.git' -o -path './node_modules' -o -path './packages/*/node_modules' -o -path './.venv' \) -prune -o -name go.mod -print | sed 's#/go.mod$##' | sort

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build detected project stacks
    deps:
      - build:site
      - build:python
      - build:go

  build:site:
    desc: Build the Bun/VitePress site when package.json exists
    status:
      - test ! -f package.json
    cmds:
      - bun run build

  build:python:
    desc: Run Python build-time validation when pyproject.toml exists
    status:
      - test ! -f pyproject.toml
    cmds:
      - uv run python -m compileall scripts

  build:go:
    desc: Build detected Go modules when go.mod exists
    status:
      - test -z "{{.GO_MODULES}}"
    cmds:
      - for: { var: GO_MODULES, split: "\n" }
        cmd: cd {{.ITEM}} && go build ./...

  test:
    desc: Run repo verification for detected stacks
    deps:
      - test:site
      - test:python
      - test:go

  test:site:
    desc: Run Bun verification when package.json exists
    status:
      - test ! -f package.json
    cmds:
      - bun run check

  test:python:
    desc: Run Python verification when pyproject.toml exists
    status:
      - test ! -f pyproject.toml
    cmds:
      - uv run python scripts/check_docs_links.py

  test:go:
    desc: Run Go tests for detected modules when go.mod exists
    status:
      - test -z "{{.GO_MODULES}}"
    cmds:
      - for: { var: GO_MODULES, split: "\n" }
        cmd: cd {{.ITEM}} && go test ./...

  lint:
    desc: Run lint checks for detected stacks
    deps:
      - lint:site
      - lint:python
      - lint:go

  lint:site:
    desc: Run Bun lint checks when package.json exists
    status:
      - test ! -f package.json
    cmds:
      - bun run lint
      - bun run lint:ts

  lint:python:
    desc: Run Python lint checks when pyproject.toml exists
    status:
      - test ! -f pyproject.toml
    cmds:
      - uv run pre-commit run --all-files

  lint:go:
    desc: Run Go lint checks for detected modules when go.mod exists
    status:
      - test -z "{{.GO_MODULES}}"
    cmds:
      - for: { var: GO_MODULES, split: "\n" }
        cmd: cd {{.ITEM}} && go fmt ./...
      - for: { var: GO_MODULES, split: "\n" }
        cmd: cd {{.ITEM}} && golangci-lint run ./...

  clean:
    desc: Remove generated artifacts and caches
    cmds:
      - task clean:site
      - task clean:python
      - task clean:go

  clean:site:
    desc: Remove Bun/VitePress build artifacts when package.json exists
    status:
      - test ! -f package.json
    cmds:
      - rm -rf .vitepress/dist .vitepress/.temp .vitepress/cache docs/.vitepress/dist docs/.vitepress/.temp docs/.vitepress/cache

  clean:python:
    desc: Remove Python caches when pyproject.toml exists
    status:
      - test ! -f pyproject.toml
    cmds:
      - find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache \) -prune -exec rm -rf {} +

  clean:go:
    desc: Remove Go test caches for detected modules when go.mod exists
    status:
      - test -z "{{.GO_MODULES}}"
    cmds:
      - for: { var: GO_MODULES, split: "\n" }
        cmd: cd {{.ITEM}} && go clean -testcache

[package]
name = "phenotype-health"
version = "0.2.0"
description = "Unified health check abstraction for service health, readiness, and liveness probes"
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/phenodocs"
documentation = "https://docs.rs/phenotype-health"
keywords = ["phenotype", "phenodocs", "health"]
categories = ["development-tools::profiling"]
authors = ["kooshapari"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }

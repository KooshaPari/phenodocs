[package]
name = "phenotype-port-interfaces"
version.workspace = true
edition.workspace = true
description = "Shared port interfaces for Hexagonal Architecture across Phenotype ecosystem"
documentation = "https://docs.rs/phenotype-port-interfaces"
keywords = ["ports", "hexagonal", "architecture", "interfaces"]
categories = ["architecture", "development-design"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/phenodocs"
authors = ["kooshapari"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }

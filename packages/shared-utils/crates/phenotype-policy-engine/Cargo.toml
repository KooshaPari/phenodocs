[package]
name = "phenotype-policy-engine"
version.workspace = true
edition.workspace = true
description = "Generic policy evaluation engine for Phenotype, supporting rule-based policy decision-making across all domains"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/phenodocs"
documentation = "https://docs.rs/phenotype-policy-engine"
keywords = ["phenotype", "phenodocs", "policy"]
categories = ["authorization"]
authors = ["kooshapari"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
dashmap.workspace = true
toml.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile = "3"

[package]
name = "phenotype-http-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "HTTP client adapter for hexagonal architecture"
repository = "https://github.com/KooshaPari/phenodocs"
documentation = "https://docs.rs/phenotype-http-adapter"
keywords = ["phenotype", "phenodocs", "http"]
categories = ["network-programming"]
authors = ["kooshapari"]

[dependencies]
# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"

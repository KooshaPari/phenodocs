[package]
name = "phenotype-event-sourcing"
version.workspace = true
description = "Append-only event store with SHA-256 hash chain verification and snapshot management"
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/phenodocs"
documentation = "https://docs.rs/phenotype-event-sourcing"
keywords = ["phenotype", "phenodocs", "event-sourcing"]
categories = ["data-structures"]
authors = ["kooshapari"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }

[package]
name = "phenotype-postgres-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PostgreSQL adapter for hexagonal architecture"
repository = "https://github.com/KooshaPari/phenodocs"
authors = ["kooshapari", "Phenotype Team"]
documentation = "https://docs.rs/phenotype-postgres-adapter"
keywords = ["phenotype", "phenodocs", "postgres"]
categories = ["database"]
authors = ["kooshapari", "Phenotype Team"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
postgres-types = { version = "0.2", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"

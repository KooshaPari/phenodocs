[package]
name = "phenotype-redis-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Redis adapter for hexagonal architecture"
repository = "https://github.com/KooshaPari/phenodocs"
documentation = "https://docs.rs/phenotype-redis-adapter"
keywords = ["phenotype", "phenodocs", "redis"]
categories = ["database"]
authors = ["kooshapari"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Redis - deadpool-redis 0.14 uses redis 0.24 internally
deadpool-redis = { version = "0.23", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"

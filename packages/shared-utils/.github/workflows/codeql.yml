name: CodeQL
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python", "actions"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
      - uses: github/codeql-action/init@03e4368ac7daa7685062b45b4916063392a8bd9a
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@461394b3130b785d9201d50e8a0c8a0c8a0c8a0c
        with:
          category: "/language:${{ matrix.language }}"

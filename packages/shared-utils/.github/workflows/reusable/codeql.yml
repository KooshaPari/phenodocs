name: Reusable CodeQL

# Reusable CodeQL workflow for KooshaPari org.
# Callers pass a JSON array of languages and optional build-mode / build-command.
# Supported languages: actions, cpp, csharp, go, java, javascript, javascript-typescript,
# kotlin, python, ruby, rust, swift.

permissions:
  contents: read
  security-events: write
  actions: read

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array of CodeQL languages, e.g. ["actions","python"]'
        required: true
        type: string
      build-mode:
        description: 'Build mode: none | autobuild | manual'
        required: false
        type: string
        default: 'none'
      build-command:
        description: 'Shell command used when build-mode=manual'
        required: false
        type: string
        default: ''
      queries:
        description: 'CodeQL query suites (comma-separated)'
        required: false
        type: string
        default: ''
      codeql-version:
        description: 'Major version of github/codeql-action to use (v3 or v4)'
        required: false
        type: string
        default: 'v3'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1

      - name: Initialize CodeQL (v3)
        if: inputs.codeql-version == 'v3'
        uses: github/codeql-action/init@03e4368ac7daa7685062b45b4916063392a8bd9a
        with:
          languages: ${{ matrix.language }}
          queries: ${{ inputs.queries }}

      - name: Initialize CodeQL (v4)
        if: inputs.codeql-version == 'v4'
        uses: github/codeql-action/init@f692bb9dd663da233e972522268e6038467a0a03
        with:
          languages: ${{ matrix.language }}
          queries: ${{ inputs.queries }}

      - name: Autobuild (v3)
        if: inputs.build-mode == 'autobuild' && inputs.codeql-version == 'v3'
        uses: github/codeql-action/autobuild@b6a47468e97101a0f434231a841c9c5faf93ae6a

      - name: Autobuild (v4)
        if: inputs.build-mode == 'autobuild' && inputs.codeql-version == 'v4'
        uses: github/codeql-action/autobuild@b6a47468e97101a0f434231a841c9c5faf93ae6a

      - name: Manual build
        if: inputs.build-mode == 'manual' && inputs.build-command != ''
        shell: bash
        run: ${{ inputs.build-command }}

      - name: Perform CodeQL Analysis (v3)
        if: inputs.codeql-version == 'v3'
        uses: github/codeql-action/analyze@03e4368ac7daa7685062b45b4916063392a8bd9a
        with:
          category: "/language:${{ matrix.language }}"

      - name: Perform CodeQL Analysis (v4)
        if: inputs.codeql-version == 'v4'
        uses: github/codeql-action/analyze@dc73d59c2d7bd4f8194098a91219eeee6d8a1719
        with:
          category: "/language:${{ matrix.language }}"

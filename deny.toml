# phenodocs — cargo-deny policy
#
# This project does not currently use Rust/Cargo crates (it is a JS/TS, Go,
# Python project).  This deny.toml is placed here as a dependency-governance
# policy document so that any future crate additions are checked automatically.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
unsound = "deny"
notice = "warn"
severity-threshold = "high"
ignore = []

[licenses]
unlicensed = "deny"
allow-osi-fsf-free = "neither"
confidence-threshold = 0.8
default = "deny"
deny = []
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "MPL-2.0",
]

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
allow-registry = ["https://github.com/rustsec/crates.io-index"]

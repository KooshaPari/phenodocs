<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="phenodocs">
  <title>phenodocs</title>
  <desc>AI-coded vector app mark: an open book of two facing pages with text lines and a rising knowledge spark, plus a ribbon bookmark. Hand-authored paths.</desc>
  <defs>
    <linearGradient id="pd-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="pd-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="pd-spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="#0D1424"/>
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="#1F2A44" stroke-width="2"/>

  <!-- Left page -->
  <path d="M 256 168
           C 212 142 156 138 116 150
           C 108 152 104 158 104 166
           V 356
           C 104 364 110 370 118 368
           C 156 358 210 362 256 388
           Z" fill="url(#pd-left)"/>
  <!-- Right page -->
  <path d="M 256 168
           C 300 142 356 138 396 150
           C 404 152 408 158 408 166
           V 356
           C 408 364 402 370 394 368
           C 356 358 302 362 256 388
           Z" fill="url(#pd-right)"/>

  <!-- Spine -->
  <rect x="250" y="168" width="12" height="220" rx="6" fill="#0D1424" opacity="0.5"/>

  <!-- Text lines on left page -->
  <g fill="#0D1424" opacity="0.45">
    <rect x="136" y="196" width="92" height="12" rx="6"/>
    <rect x="136" y="224" width="80" height="12" rx="6"/>
    <rect x="136" y="252" width="92" height="12" rx="6"/>
  </g>
  <!-- Text lines on right page -->
  <g fill="#0D1424" opacity="0.40">
    <rect x="284" y="196" width="92" height="12" rx="6"/>
    <rect x="284" y="224" width="80" height="12" rx="6"/>
    <rect x="284" y="252" width="92" height="12" rx="6"/>
  </g>

  <!-- Ribbon bookmark on right page -->
  <path d="M 360 140 H 392 V 214 L 376 198 L 360 214 Z" fill="#EF4444"/>

  <!-- Knowledge spark rising from the spine -->
  <path d="M 256 96 L 268 124 L 296 132 L 268 140 L 256 168 L 244 140 L 216 132 L 244 124 Z" fill="url(#pd-spark)"/>
</svg>

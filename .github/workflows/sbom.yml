name: Generate SBOM

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@4a83e1fa8a49c8b54b2478e3dfafcc2d1417b432
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd0de8ccd5686b70862
        with:
          name: sbom-${{ github.event.inputs.version || github.ref_name }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95f20ddfc40fe273f2e886b5d5cc2a201cb4b1d
        with:
          files: sbom.cdx.json

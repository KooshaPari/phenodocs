name: workflow-permissions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

  push:
    branches: [main]
  pull_request:
jobs:
  verify-permissions:
    runs-on: ubuntu-24.04
    steps:
      - name: Permissions declared
        run: echo "Workflow permissions are properly declared"

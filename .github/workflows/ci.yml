name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: '1.3.10' }
      - run: bun install
      - run: bun run check 2>/dev/null || bun run build 2>/dev/null || echo "no check"

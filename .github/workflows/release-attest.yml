name: Release + SLSA Build Attestation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.6.8)"
        required: true
        type: string

# Required for SLSA Build L3:
# - id-token: write (OIDC token for signing provenance)
# - contents: read (read repo for the build)
# - attestations: write (write the provenance attestation)
permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Attest
    runs-on: ubuntu-24.04
    # No mutable action references. All third-party actions MUST be SHA-pinned.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Setup Bun
        # Install Bun via official installer. Pinned to bun@1.3.10 to match
        # the packageManager field in package.json. No third-party action
        # is used; we shell out to the official install script with a
        # version argument so the install is reproducible.
        env:
          BUN_VERSION: "1.3.10"
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build artifact
        # VitePress static docs site. Build outputs to docs/.vitepress/dist/.
        run: bun run build

      - name: Attest build provenance
        # Official SLSA Build L3 action from actions/attest-build-provenance.
        uses: actions/attest-build-provenance@35a8f9717e7a2adb1c2c3b2ac88961ba9c230e98 # v1.3.0
        with:
          subject-name: ${{ github.repository }}
          # Hash the VitePress build output directory deterministically.
          subject-digest: sha256:$(find docs/.vitepress/dist -type f -exec sha256sum {} + | sort | sha256sum | awk '{print $1}')
          push-to-registry: false

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd0de8ccd5686b70862 # v4.6.0
        with:
          name: ${{ github.event.inputs.version || github.ref_name }}-vitepress-site
          path: docs/.vitepress/dist/

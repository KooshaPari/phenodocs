name: Journey Verify

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'docs/journeys/**'
      - 'docs/operations/journey-traceability.md'
      - 'docs/governance/journeys.md'
  pull_request:
    paths:
      - 'docs/journeys/**'
      - 'docs/operations/journey-traceability.md'
      - 'docs/governance/journeys.md'

permissions:
  contents: read

jobs:
  verify:
    name: Journey manifest sanity check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate journey manifests
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Real verify via `phenotype-journey verify` will be wired in once
          # the phenodocs repo vendors the binary (tracked in phenodocs#168).
          # For now, sanity-check the manifest shape and required fields.
          if [ ! -d docs/journeys/manifests ]; then
            echo "No docs/journeys/manifests directory; nothing to verify."
            exit 0
          fi
          fail=0
          for manifest in docs/journeys/manifests/*.journey.yaml; do
            [ -e "$manifest" ] || continue
            echo "Validating $manifest"
            for field in id intent keyframe_count; do
              if ! grep -qE "^${field}:" "$manifest"; then
                echo "::error file=$manifest::missing required field '$field'"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more manifests are missing required fields." >&2
            exit 1
          fi
          echo "All journey manifests pass sanity check."

name: Security Guard (Hooks)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Audit hook configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f .pre-commit-config.yaml ]]; then
            echo "Found .pre-commit-config.yaml"
          else
            echo "No .pre-commit-config.yaml present"
          fi

          if [[ -d .githooks ]]; then
            find .githooks -maxdepth 2 -type f -print | sort
          else
            echo "No .githooks directory present"
          fi

name: Security Guard (Hooks)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Audit hook configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f .pre-commit-config.yaml ]]; then
            echo "Found .pre-commit-config.yaml"
          else
            echo "No .pre-commit-config.yaml present"
          fi

          if [[ -d .githooks ]]; then
            find .githooks -maxdepth 2 -type f -print | sort
          else
            echo "No .githooks directory present"
          fi
